[project]
name = "geosearch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "catboost>=1.2.10",
    "country-list>=1.1.0",
    "fastapi[standard]>=0.137.1",
    "gliner>=0.2.26",
    "httpx>=0.28.1",
    "openai>=2.45.0",
    "polars>=1.41.2",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.1",
    "rank-bm25>=0.2.2",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "ir-measures>=0.4.3",
    "pandas>=3.0.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "tqdm>=4.68.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
