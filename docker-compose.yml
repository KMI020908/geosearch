services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host from localhost (.env) to the Docker service name
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Load the persisted BM25 index on start (it lives in ./data, bind-mounted
      # below). Delete data/bm25_index.pkl after a corpus change to rebuild it.
      INDEX_WARM_START: "true"
    volumes:
      # Persist the downloaded GLiNER model weights across restarts
      - hf_cache:/root/.cache/huggingface
      # Bind-mount the host data dir at the WORKDIR-relative path config expects
      # (/app/data). This is the single source of truth: the reranker model,
      # BM25 index, and datasets the Makefile writes on the host are all visible
      # to the container, and vice versa.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  hf_cache:
