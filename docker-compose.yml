services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host from localhost (.env) to the Docker service name
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Write the BM25 index onto the persisted volume below, not the ephemeral
      # container FS — otherwise the index is rebuilt on every container start.
      INDEX_PATH: /data/bm25_index.pkl
    volumes:
      # Persist the downloaded GLiNER model weights across restarts
      - hf_cache:/root/.cache/huggingface
      # Persist the BM25 index so it survives restarts
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  hf_cache:
  app_data:
